name: Release

on:
  push:
    tags:
      - "v*"

env:
  GO_VERSION: "1.25"

permissions:
  contents: write

jobs:
  # Run tests before release
  test:
    name: Pre-release Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run tests
        run: go test -race ./...

  release:
    name: Build and Release
    needs: test
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            runner: ubuntu-latest
          - goos: darwin
            goarch: amd64
            runner: macos-latest
          - goos: darwin
            goarch: arm64
            runner: macos-latest
          - goos: windows
            goarch: amd64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          OUTPUT_NAME="rift-server-${VERSION}-${GOOS}-${GOARCH}"
          if [ "$GOOS" = "windows" ]; then
            OUTPUT_NAME="${OUTPUT_NAME}.exe"
          fi
          
          echo "Building ${OUTPUT_NAME}..."
          go build -ldflags="-s -w -X github.com/mohamed-rekiba/rift/internal/cli.Version=${VERSION} -X github.com/mohamed-rekiba/rift/internal/cli.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ) -X github.com/mohamed-rekiba/rift/internal/cli.GitCommit=$(git rev-parse --short HEAD)" -o "${OUTPUT_NAME}" ./cmd/server
          
          # Ad-hoc sign macOS binaries to reduce Gatekeeper friction
          if [ "$GOOS" = "darwin" ]; then
            echo "Signing macOS binary..."
            codesign --force --deep -s - "${OUTPUT_NAME}"
          fi
          
          if [ "$GOOS" = "windows" ]; then
            zip "${OUTPUT_NAME%.exe}.zip" "${OUTPUT_NAME}"
            echo "ARCHIVE=${OUTPUT_NAME%.exe}.zip" >> $GITHUB_ENV
          else
            tar -czvf "${OUTPUT_NAME}.tar.gz" "${OUTPUT_NAME}"
            echo "ARCHIVE=${OUTPUT_NAME}.tar.gz" >> $GITHUB_ENV
          fi
          
          echo "✅ Built and archived ${OUTPUT_NAME}"

      - name: Generate checksum
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          if [ -f "$ARCHIVE" ]; then
            sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
            echo "Checksum: $(cat ${ARCHIVE}.sha256)"
          fi

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rift-server-${{ steps.version.outputs.VERSION }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            rift-server-*.tar.gz
            rift-server-*.zip
            rift-server-*.sha256

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: List artifacts
        run: |
          echo "📦 Release artifacts:"
          find artifacts -type f | sort

      - name: Generate release notes
        id: notes
        run: |
          # Get commits since last tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            echo "## What's Changed" > release-notes.md
            echo "" >> release-notes.md
            git log --pretty=format:"- %s" ${PREV_TAG}..HEAD >> release-notes.md
            echo "" >> release-notes.md
          fi
          
          # Add installation instructions
          cat >> release-notes.md << 'EOF'
          
          ## Installation
          
          ### Binary Download
          Download the appropriate binary for your platform from the assets below.
          
          ### Verify Checksums
          Each archive has an accompanying `.sha256` file for verification:
          ```bash
          sha256sum -c rift-server-*.sha256
          ```
          
          ## Quick Start
          ```bash
          # Start the server
          ./rift-server
          
          # Create a tunnel (from client)
          ssh -t -R 0:localhost:3000 user@your-server.com -p 2222
          ```
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: Rift ${{ steps.version.outputs.VERSION }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/**/*.sha256

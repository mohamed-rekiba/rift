version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - unparam
    - gocritic

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false
      exclude-functions:
        - (io.Closer).Close
        - os.Setenv
        - os.Unsetenv

    govet:
      enable-all: true
      disable:
        - fieldalignment

    misspell:
      locale: US

    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - hugeParam
        - rangeValCopy
        - ifElseChain

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gocritic
      - path: embed\.go
        linters:
          - lll

formatters:
  enable:
    - gofmt
    - goimports

  settings:
    gofmt:
      simplify: true

    goimports:
      local-prefixes:
        - github.com/mohamed-rekiba/rift

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
